aid: digital-diagnostics
name: Digital Diagnostics
description: >-
  Digital Diagnostics is a healthcare AI company based in Coralville, Iowa,
  founded by Dr. Michael Abramoff. It builds autonomous artificial-intelligence
  diagnostic systems that make a medical diagnosis at the point of care without
  requiring a physician to interpret the result. Its flagship product,
  LumineticsCore (formerly IDx-DR), was the first FDA-cleared autonomous AI
  diagnostic system and detects diabetic retinopathy from fundus images in about
  30 seconds, reimbursed under CPT code 92229 and integrated with EHR systems
  such as Epic. A companion product, SphereDx, provides securely hosted
  diagnostic result management. The company is a portfolio company of 8vc and is
  researching additional indications including glaucoma, age-related macular
  degeneration, cardiovascular, and neurodegenerative disease detection via
  retinal imaging. Digital Diagnostics emphasizes ethical, equitable AI ("AI the
  right way") and holds ISO 13485:2016 quality-management certification. As of
  this profile the company publishes no public developer API, SDK, or developer
  portal.
